name: MacOS

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master", "develop" ]
  workflow_call:
    inputs:
      version:
        description: 'Version to build'
        default: 2.x.x
        type: string
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    # macOS-13 (Ventura) is required: AGL.framework was removed in macOS 14 and Qt < 6.7 depends on it.
    # Once Qt is upgraded to 6.7+, this can move back to macos-latest.
    runs-on: macos-13

    steps:
    - uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.6.2'
        modules: qtwebsockets
        target: 'desktop'
        arch: clang_64
        install-deps: 'true'
        cache: true

    - name: Install OpenAL
      run: brew install openal-soft

    - name: Checkout submodules
      run: git submodule update --init --recursive

    - name: Configure & build CMake
      run: |
        echo 'Generating makefile'
        mkdir build
        cd build
        echo 'Version : '  ${{ inputs.version }}
        cmake .. -DCMAKE_BUILD_TYPE=Release -DSUGARBOX_VERSION='${{ inputs.version }}'
        make -j$(sysctl -n hw.logicalcpu)
        ls -l

    - name: Install pytest
      run: pip3 install pytest

    - name: Find Sugarbox binary
      run: |
        BINARY=$(find ${{ github.workspace }}/build/Sugarbox -type f -name "Sugarbox" | head -1)
        echo "SUGARBOX_BINARY=$BINARY" >> $GITHUB_ENV
        echo "Found binary: $BINARY"

    - name: Run protocol integration tests
      run: |
        cd Sugarbox/debugers
        python3 -m pytest test_protocol.py z80-debug-adapter/test_conformance.py -v --tb=short
      env:
        SUGARBOX_BINARY: ${{ env.SUGARBOX_BINARY }}
        SUGARBOX_PORT: 1234

    - name: Package
      run: |
        cd build
        make package
        ls -l

    - name: Archive zip
      uses: actions/upload-artifact@v4
      with:
          name: SugarboxV2MacOS
          path: ${{github.workspace}}/build/*.tar.gz
