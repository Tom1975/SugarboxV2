name: Windows

on:
  workflow_call:
    inputs: 
      version:
        description: 'Version to build'
        default: 2.x.x
        type: string      
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master", "develop" ]
  
env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    matrix:
        include: [
            { arch: win64_msvc2019_64, runner: windows-latest, zipname: SugarboxV2_32 },
            { arch: win64_msvc2019_32, runner: windows-latest, zipname: SugarboxV2_64 },
        ]
    name: ${{ arch }}
    runs-on: ${{ matrix.runner }}  

    steps:
    - uses: actions/checkout@v3
    
    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.6.*'
        target: 'desktop'
        arch: ${{ matrix.arch }}  
        install-deps: 'true'
        modules: qtwebsockets 
        
    - name: Install udev
      run: ${{ matrix.other_installer }}
        
    - name: Checkout submodules
      run: git submodule update --init --recursive 

    - name: Configure CMake
      run: |
        echo 'Version : '  ${{ inputs.version }}
        cmake -DCMAKE_BUILD_TYPE=Release -B ${{github.workspace}}\build  -DCMAKE_INSTALL_PREFIX=${{github.workspace}}\install -DSUGARBOX_VERSION='${{ inputs.version }}'

    - name: Build
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}\build --config ${{env.BUILD_TYPE}} 

    - name: Install
      # Make install
      run: cmake --install ${{github.workspace}}\build

    - name: Packaging
      # CPack time
      working-directory: ${{github.workspace}}\build
      run: cpack -G 7Z .
      
    - name: Archive zip
      uses: actions/upload-artifact@v3
      with:
          name: ${{ matrix.zipname}}
          path: ${{github.workspace}}\build\*.7z
          
          
