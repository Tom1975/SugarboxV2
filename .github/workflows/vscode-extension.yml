name: VS Code Extension

on:
  push:
    branches: ["master", "develop"]
    paths:
      - "Sugarbox/debugers/z80-debug-adapter/**"
  pull_request:
    branches: ["master", "develop"]
    paths:
      - "Sugarbox/debugers/z80-debug-adapter/**"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Sugarbox/debugers/z80-debug-adapter

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Sugarbox/debugers/z80-debug-adapter/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile
