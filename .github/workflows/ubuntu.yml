name: Ubuntu

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master", "develop" ]
  workflow_call:
    inputs:
      version:
        description: 'Version to build'
        default: 2.x.x
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    # ubuntu-22.04 (GLIBC 2.35) — oldest supported LTS; AppImage built here
    # runs on 22.04, 24.04 and future 26.04+ without recompilation.
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --fix-missing \
          build-essential libpthread-stubs0-dev \
          libgl1-mesa-dev libglu1-mesa-dev freeglut3-dev \
          libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
          libfreetype6-dev libglew-dev libjpeg-dev \
          libudev-dev libsecret-1-dev libnotify-dev \
          checkinstall libtiff5-dev libcairo2-dev \
          xvfb libopenal1 python3-pytest \
          libfuse2

    - name: Install Qt 6.7
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.7.3'
        modules: qtwebsockets
        target: 'desktop'
        arch: gcc_64
        install-deps: 'true'
        cache: true

    - name: Checkout submodules
      run: git submodule update --init --recursive

    - name: Build
      run: |
        mkdir build && cd build
        echo 'Version : ' ${{ inputs.version }}
        cmake .. -DCMAKE_BUILD_TYPE=Release -DSUGARBOX_VERSION='${{ inputs.version }}'
        make -j$(nproc)

    - name: Run protocol integration tests
      run: |
        cd Sugarbox/debugers
        pytest test_protocol.py z80-debug-adapter/test_conformance.py -v --tb=short
      env:
        SUGARBOX_BINARY: ${{ github.workspace }}/build/Sugarbox/Sugarbox
        SUGARBOX_PORT: 1234

    - name: Download linuxdeploy + Qt plugin
      run: |
        wget -q -O linuxdeploy.AppImage \
          https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
        wget -q -O linuxdeploy-plugin-qt.AppImage \
          https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
        chmod +x linuxdeploy.AppImage linuxdeploy-plugin-qt.AppImage

    - name: Populate AppDir
      run: |
        cmake --install build --prefix AppDir/usr

        # Custom AppRun: fix CWD so Sugarbox finds ROM/, CONF/, etc. via
        # std::filesystem::current_path() (relative to the binary directory).
        cat > AppDir/AppRun << 'APPRUN'
        #!/bin/bash
        SELF=$(readlink -f "$0")
        HERE="${SELF%/*}"
        cd "$HERE/usr"
        export LD_LIBRARY_PATH="$HERE/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
        export QT_PLUGIN_PATH="$HERE/usr/plugins"
        export QT_QPA_PLATFORM_PLUGIN_PATH="$HERE/usr/plugins/platforms"
        exec "$HERE/usr/Sugarbox" "$@"
        APPRUN
        chmod +x AppDir/AppRun

    - name: Build AppImage
      env:
        QMAKE: ${{ env.Qt6_DIR }}/bin/qmake
        OUTPUT: Sugarbox-Linux-x86_64.AppImage
      run: |
        ./linuxdeploy.AppImage \
          --appdir AppDir \
          --executable AppDir/usr/Sugarbox \
          --desktop-file Sugarbox/sugarbox.desktop \
          --icon-file Sugarbox/sugarbox.svg \
          --plugin qt \
          --output appimage

    - name: Archive AppImage
      uses: actions/upload-artifact@v4
      with:
        name: SugarboxV2-Linux-AppImage
        path: Sugarbox-*.AppImage
