name: Release

on:
  workflow_dispatch :
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  extract-version:
    runs-on: ubuntu-latest
    outputs:
      Sugarbox_version: '${{ steps.vars.outputs.version }}'
    steps:
      - name: Get tag/branch name
        id: vars
        run: |
          echo "version=${GITHUB_REF#refs/*/}" >> "$GITHUB_OUTPUT"
          
  call-workflow-windows:
    needs: extract-version
    uses:  ./.github/workflows/windows.yml
    with:
      version: ${{ needs.extract-version.outputs.Sugarbox_version }}
  call-workflow-ubuntu:
    needs: extract-version
    uses:  ./.github/workflows/ubuntu.yml
    with:
      version: ${{ needs.extract-version.outputs.Sugarbox_version }}
  call-workflow-macos:
    needs: extract-version
    uses:  ./.github/workflows/macos.yml
    with:
      version: ${{ needs.extract-version.outputs.Sugarbox_version }}

  deploy:
    runs-on: ubuntu-latest
    needs: [call-workflow-windows, call-workflow-ubuntu, call-workflow-macos]
    permissions:
      contents: write
    steps:
      - name: Prepare Release directory
        run: |
          mkdir release_bin
          cd release_bin

      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          pattern: SugarboxV2*
          path: release_bin
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release_bin/*
