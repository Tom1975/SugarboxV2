name: Release

on:
  workflow_dispatch :
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  extract-version:
    runs-on: ubuntu-latest
    outputs:
      Sugarbox_version: '${{ steps.vars.outputs.version }}'
    steps:
      - name: Get tag/branch name
        id: vars
        run: |
          echo "version=${GITHUB_REF#refs/*/}" >> "$GITHUB_OUTPUT"
          
  call-workflow-windows:
    needs: extract-version
    uses:  ./.github/workflows/windows.yml
    with:
      version: ${{ needs.extract-version.outputs.Sugarbox_version }}
  call-workflow-ubuntu:
    needs: extract-version
    uses:  ./.github/workflows/ubuntu.yml
    with:
      version: ${{ needs.extract-version.outputs.Sugarbox_version }}
  call-workflow-macos:
    needs: extract-version
    uses:  ./.github/workflows/macos.yml
    with:
      version: ${{ needs.extract-version.outputs.Sugarbox_version }}

  build-vsix:
    runs-on: ubuntu-latest
    needs: extract-version
    defaults:
      run:
        working-directory: Sugarbox/debugers/z80-debug-adapter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Sugarbox/debugers/z80-debug-adapter/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Compile TypeScript
        run: npm run compile
      - name: Package VSIX
        run: |
          VERSION="${{ needs.extract-version.outputs.Sugarbox_version }}"
          python3 make_vsix.py --no-compile --version "${VERSION#v}"
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: z80-debug-vsix
          path: Sugarbox/debugers/z80-debug-adapter/*.vsix

  deploy:
    runs-on: ubuntu-latest
    needs: [call-workflow-windows, call-workflow-ubuntu, call-workflow-macos, build-vsix]
    steps:
      - name: Prepare Release directory
        run: |
          mkdir release_bin
          cd release_bin

      - name: Download artifact Ubuntu
        uses: actions/download-artifact@v4
        id: art-ubuntu
        with:
          name: SugarboxV2Ubuntu

      - name: Download artifact Windows
        uses: actions/download-artifact@v4
        id: art-windows
        with:
          name: SugarboxV2

      - name: Download artifact MacOS
        uses: actions/download-artifact@v4
        id: art-macos
        with:
          name: SugarboxV2MacOS

      - name: Download artifact VSIX
        uses: actions/download-artifact@v4
        id: art-vsix
        with:
          name: z80-debug-vsix

      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ steps.art-ubuntu.outputs.download-path }}/*
            ${{ steps.art-windows.outputs.download-path }}/*
            ${{ steps.art-macos.outputs.download-path }}/*
            ${{ steps.art-vsix.outputs.download-path }}/*.vsix

